<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="News">
<meta name="referrer" content="no-referrer">
<title>News</title>
<style>
:root{--bg:#fff;--card:#f2f3f5;--tx:#111827;--mute:#6b7280;--ac:#2563eb;--bd:#e5e7eb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b0d10;--card:#171a1f;--tx:#e8eaed;--mute:#9aa0a6;--ac:#6ea0ff;--bd:#272b32;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b0d10;--card:#171a1f;--tx:#e8eaed;--mute:#9aa0a6;--ac:#6ea0ff;--bd:#272b32;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--bd);z-index:5}
.row{display:flex;gap:8px;align-items:center}h1{font-size:22px;margin:0;flex:1}
button,select,input{font:inherit;color:var(--tx)}
.ib{background:none;border:0;font-size:22px;padding:4px 8px;color:var(--tx)}
.seg{display:flex;background:var(--card);border-radius:10px;padding:2px;margin:10px 0 8px}
.seg button{flex:1;border:0;background:none;padding:6px;border-radius:8px}
.seg button.on{background:var(--bg);font-weight:600;box-shadow:0 1px 2px #0003}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:0;background:var(--card);padding:5px 12px;border-radius:99px;font-size:14px}
.chip.on{background:var(--ac);color:#fff}
main{padding:0 14px 40px;max-width:720px;margin:auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:20px 0 6px}
a.card{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--bd);color:inherit;text-decoration:none}
.card .t{font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--mute);margin-bottom:2px}
.card .s{font-size:14px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.card img{width:80px;height:80px;object-fit:cover;border-radius:8px;background:var(--card);flex:none}
.card>div{flex:1;min-width:0}
#st{font-size:13px;color:var(--mute);padding:8px 0}
dialog{width:min(560px,94vw);max-height:90vh;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:16px}
dialog::backdrop{background:#0008}
.set h3{margin:16px 0 6px;font-size:14px;color:var(--mute)}
.src{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.src span{flex:1}.src small{color:var(--mute)}
input[type=text],input[type=url],select{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);margin:4px 0}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:8px}
</style></head><body>
<header><div class="row"><h1>News</h1><button class="ib" id="rf" aria-label="Aktualisieren">↻</button><button class="ib" id="cfg" aria-label="Einstellungen">⚙︎</button></div>
<div class="seg" id="tp"></div><div class="chips" id="ch"></div></header>
<main><div id="st"></div><div id="list"></div></main>
<dialog id="dlg"><div class="set" id="set"></div><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="cl">Fertig</button></div></dialog>
<script>
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const DEF=[["GameStar","https://www.gamestar.de/news/rss/news.rss","g"],["GamePro","https://www.gamepro.de/rss/news.rss","g"],["IGN","https://feeds.ign.com/ign/all","g"],["PC Gamer","https://www.pcgamer.com/rss/","g"],["Eurogamer","https://www.eurogamer.net/feed","g"],["All3DP","https://all3dp.com/feed/","d"],["3DPrint.com","https://3dprint.com/feed/","d"],["3Dnatives","https://www.3dnatives.com/en/feed/","d"],["Hackaday 3D","https://hackaday.com/category/3d-printing/feed/","d"]].map((a,i)=>({id:"s"+i,name:a[0],url:a[1],topic:a[2],on:true}));
const TOP={g:"Gaming",d:"3D-Druck"};
const S={sources:ls.get("src",DEF),days:ls.get("days",3),theme:ls.get("theme","auto"),topic:null,sel:new Set(),arts:ls.get("arts",[]),fail:[],busy:false};
const save=()=>{ls.set("src",S.sources);ls.set("days",S.days);ls.set("theme",S.theme)};
const PROXY=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u)];
function h(tag,props={},...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==="on")for(const[ev,f]of Object.entries(v))e.addEventListener(ev,f);else if(k in e)e[k]=v;else e.setAttribute(k,v)}for(const c of kids)e.append(c);return e}
const safe=u=>/^https?:\/\//i.test(u||"")?u:"";
function theme(){const r=document.documentElement;S.theme==="auto"?r.removeAttribute("data-theme"):r.dataset.theme=S.theme==="day"?"light":"dark"}
async function getXml(url){for(const p of PROXY){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);const r=await fetch(p(url),{signal:c.signal});clearTimeout(t);if(!r.ok)continue;const x=new DOMParser().parseFromString(await r.text(),"text/xml");if(!x.querySelector("parsererror"))return x}catch{}}return null}
const plain=s=>(new DOMParser().parseFromString(s||"","text/html").body.textContent||"").replace(/\s+/g," ").trim();
function parse(x,s){return[...x.querySelectorAll("item,entry")].slice(0,40).map(n=>{
 const g=t=>{const e=n.getElementsByTagName(t)[0];return e?e.textContent.trim():""};
 const al=[...n.getElementsByTagName("link")].find(e=>e.getAttribute("href")&&(e.getAttribute("rel")||"alternate")==="alternate");
 const link=al?al.getAttribute("href"):g("link");
 const raw=g("description")||g("summary")||g("content");
 let img="";const en=n.getElementsByTagName("enclosure")[0],mt=n.getElementsByTagName("media:thumbnail")[0]||n.getElementsByTagName("media:content")[0];
 if(en&&(en.getAttribute("type")||"image").startsWith("image"))img=en.getAttribute("url");else if(mt)img=mt.getAttribute("url");
 else{const m=raw.match(/<img[^>]+src=["']([^"']+)/i);if(m)img=m[1]}
 const d=Date.parse(g("pubDate")||g("published")||g("updated")||g("dc:date"));
 return{id:link,t:plain(g("title")),l:safe(link),s:plain(raw).slice(0,160),d:isNaN(d)?Date.now():d,i:safe(img),sid:s.id,sn:s.name,tp:s.topic}}).filter(a=>a.t&&a.l)}
async function viaJson(url){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url),{signal:c.signal});clearTimeout(t);if(!r.ok)return null;const j=await r.json();return j.status==="ok"?j.items:null}catch{return null}}
async function load(s){const j=await viaJson(s.url);
 if(j&&j.length)return j.map(i=>{const raw=i.description||i.content||"",m=raw.match(/<img[^>]+src=["']([^"']+)/i),d=Date.parse((i.pubDate||"").replace(" ","T")+"Z");return{id:i.link,t:plain(i.title),l:safe(i.link),s:plain(raw).slice(0,160),d:isNaN(d)?Date.now():d,i:safe(i.thumbnail||(i.enclosure&&i.enclosure.link)||(m&&m[1])||""),sid:s.id,sn:s.name,tp:s.topic}}).filter(a=>a.t&&a.l);
 const x=await getXml(s.url);return x?parse(x,s):null}
async function refresh(){if(S.busy)return;S.busy=true;S.fail=[];const cut=Date.now()-S.days*864e5,fresh=new Map();render();
 await Promise.all(S.sources.filter(s=>s.on).map(async s=>{const arr=await load(s);if(!arr){S.fail.push(s.name);return}for(const a of arr)if(a.d>=cut)fresh.set(a.id,a);S.arts=[...fresh.values()];render()}));
 S.busy=false;ls.set("arts",S.arts);render()}
function dayTitle(t){const d=new Date(t),n=new Date();const k=x=>new Date(x).setHours(0,0,0,0);const diff=Math.round((k(n)-k(d))/864e5);
 return diff===0?"Heute":diff===1?"Gestern":d.toLocaleDateString("de-DE",{weekday:"long",day:"numeric",month:"long"})}
function render(){
 const act=new Set(S.sources.filter(s=>s.on).map(s=>s.id));
 const tp=$("#tp");tp.replaceChildren(...[[null,"Alle"],["g","Gaming"],["d","3D-Druck"]].map(([v,l])=>h("button",{textContent:l,className:S.topic===v?"on":"",on:{click(){S.topic=v;S.sel.clear();render()}}})));
 $("#ch").replaceChildren(...S.sources.filter(s=>s.on&&(!S.topic||s.topic===S.topic)).map(s=>h("button",{textContent:s.name,className:"chip"+(S.sel.has(s.id)?" on":""),on:{click(){S.sel.has(s.id)?S.sel.delete(s.id):S.sel.add(s.id);render()}}})));
 const list=S.arts.filter(a=>act.has(a.sid)&&(!S.topic||a.tp===S.topic)&&(!S.sel.size||S.sel.has(a.sid))&&a.d>=Date.now()-S.days*864e5).sort((a,b)=>b.d-a.d);
 const groups=new Map();for(const a of list){const k=dayTitle(a.d);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(a)}
 const out=[];for(const[k,arr]of groups){out.push(h("h2",{textContent:k}));for(const a of arr)out.push(h("a",{className:"card",href:a.l,target:"_blank",rel:"noopener noreferrer"},
  h("div",{},h("div",{className:"m",textContent:a.sn+" · "+new Date(a.d).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}),h("div",{className:"t",textContent:a.t}),h("div",{className:"s",textContent:a.s})),
  ...(a.i?[h("img",{src:a.i,loading:"lazy",referrerPolicy:"no-referrer",alt:""})]:[])))}
 $("#list").replaceChildren(...out);
 $("#st").textContent=S.busy?"Lade …":S.fail.length?"Nicht erreichbar: "+S.fail.join(", "):(list.length?"":"Keine Artikel")}
function settings(){
 const box=$("#set");
 const seg=(vals,cur,fn)=>h("div",{className:"seg"},...vals.map(([v,l])=>h("button",{textContent:l,className:cur===v?"on":"",on:{click(){fn(v)}}})));
 const nm=h("input",{type:"text",placeholder:"Name"}),url=h("input",{type:"url",placeholder:"RSS-URL (https://…)"}),tp=h("select",{},h("option",{value:"g",textContent:"Gaming"}),h("option",{value:"d",textContent:"3D-Druck"}));
 box.replaceChildren(
  h("h3",{textContent:"Darstellung"}),seg([["auto","System"],["day","Tag"],["night","Nacht"]],S.theme,v=>{S.theme=v;save();theme();settings()}),
  h("h3",{textContent:"Zeitraum: letzte "+S.days+" Tage"}),h("input",{type:"range",min:1,max:14,value:S.days,style:"width:100%",on:{input(e){S.days=+e.target.value;save();e.target.previousSibling.textContent="Zeitraum: letzte "+S.days+" Tage"},change(){render()}}}),
  h("h3",{textContent:"Quellen"}),
  ...S.sources.map(s=>h("div",{className:"src"},h("input",{type:"checkbox",checked:s.on,on:{change(e){s.on=e.target.checked;save();render()}}}),h("span",{},s.name+" ",h("small",{textContent:TOP[s.topic]})),h("button",{className:"ib",textContent:"✕",ariaLabel:"Entfernen",on:{click(){S.sources=S.sources.filter(x=>x!==s);S.sel.delete(s.id);save();render();settings()}}}))),
  h("h3",{textContent:"Quelle hinzufügen"}),nm,url,tp,
  h("button",{className:"btn",textContent:"Hinzufügen",on:{click(){if(!nm.value.trim()||!/^https:\/\//i.test(url.value.trim()))return alert("Name und https-URL nötig");S.sources.push({id:"u"+Date.now(),name:nm.value.trim(),url:url.value.trim(),topic:tp.value,on:true});save();settings();refresh()}}}))}
$("#cfg").onclick=()=>{settings();$("#dlg").showModal()};
$("#cl").onclick=()=>{$("#dlg").close();refresh()};
$("#rf").onclick=refresh;
theme();render();refresh();
</script></body></html>
